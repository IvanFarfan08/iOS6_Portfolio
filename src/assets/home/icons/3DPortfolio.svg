<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#7B68EE"/>
      <stop offset="100%" style="stop-color:#4B0082"/>
    </linearGradient>
    <linearGradient id="cubeTop" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#E0E0E0"/>
      <stop offset="100%" style="stop-color:#A0A0A0"/>
    </linearGradient>
    <linearGradient id="cubeLeft" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#808080"/>
      <stop offset="100%" style="stop-color:#B0B0B0"/>
    </linearGradient>
    <linearGradient id="cubeRight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#C0C0C0"/>
      <stop offset="100%" style="stop-color:#909090"/>
    </linearGradient>
  </defs>
  <!-- Background with iOS 6 style rounded corners -->
  <rect x="0" y="0" width="80" height="80" rx="16" ry="16" fill="url(#bg)"/>
  <!-- Gloss effect -->
  <rect x="0" y="0" width="80" height="40" rx="16" ry="16" fill="rgba(255,255,255,0.3)" clip-path="inset(0 0 50% 0)"/>
  <!-- 3D Cube -->
  <!-- Top face -->
  <polygon points="40,18 58,28 40,38 22,28" fill="url(#cubeTop)"/>
  <!-- Left face -->
  <polygon points="22,28 40,38 40,58 22,48" fill="url(#cubeLeft)"/>
  <!-- Right face -->
  <polygon points="40,38 58,28 58,48 40,58" fill="url(#cubeRight)"/>
  <!-- Cube edges -->
  <polygon points="40,18 58,28 40,38 22,28" fill="none" stroke="#fff" stroke-width="1" opacity="0.5"/>
  <polygon points="22,28 40,38 40,58 22,48" fill="none" stroke="#fff" stroke-width="1" opacity="0.3"/>
  <polygon points="40,38 58,28 58,48 40,58" fill="none" stroke="#fff" stroke-width="1" opacity="0.3"/>
</svg>
