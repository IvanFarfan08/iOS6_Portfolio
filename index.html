        <h1>Ivan Farfan Diaz</h1>
        <h2>Full-Stack Software Engineer & Automation Engineer</h2>
        <p>Senior Software Engineering student at <strong>Stevens Institute of Technology</strong>. Automation Engineer at <strong>One Stone LLC</strong>. Based in Hoboken, NJ.</p>

        <h3>Technical Skills</h3>
        <p>Full-stack developer working with React, TypeScript, Tailwind CSS, Python, Flask, Swift, SwiftUI, and Blender. Experienced with REST APIs, computer vision, machine learning pipelines, and CRM automation.</p>

        <h3>Work Experience</h3>
        <p>At One Stone LLC, Ivan designs and implements automations for CRM systems — building REST API integrations, automated workflows, and custom dashboards that give sales teams real-time pipeline visibility.</p>

        <h3>Vertex — Award-Winning 3D Modeling Startup</h3>
        <p>Vertex is a wireframe-to-3D-model pipeline using machine learning to convert hand-drawn sketches into editable 3D geometry. Built with React and Python/Flask, leveraging custom-trained computer vision models. Winner of the <strong>Thomas H. Scholl Award (2024)</strong> at Stevens for technical innovation and commercial viability. Part of the Launchpad / iSTEM program since 2022.</p>

        <h3>Blueprint — VP of Design</h3>
        <p>VP of Design at Blueprint, a student-run organization developing free software solutions for non-profit organizations. Leads the design team across multiple NPO projects, conducts design reviews, and mentors junior designers on accessibility and user-centered design.</p>

        <h2>Projects</h2>
        <ul>
          <li><strong>Vertex</strong> — Wireframe-to-3D-model pipeline using ML to convert sketches into editable geometry. React + Python/Flask. Thomas H. Scholl Award Winner (2024). <a href="https://vertex3d.site/">Visit Vertex</a></li>
          <li><strong>DishDetective</strong> — AI-powered Point-of-Sale system using Google's Teachable Machine for computer vision-based food recognition. <a href="https://github.com/IvanFarfan08/DishDetective">View on GitHub</a></li>
          <li><strong>Recalled</strong> — iOS and visionOS app for scanning product barcodes against FDA and CPSC recall databases in real time. Built with Swift. <a href="https://devpost.com/software/hackathon-project-3kxw6c">View on Devpost</a></li>
          <li><strong>Vertex Annotator</strong> — Web platform for creating labeled wireframe parsing datasets for ML training. <a href="https://www.vertexannotator.xyz/">Visit site</a></li>
        </ul>
